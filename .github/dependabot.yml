version: 2
updates:
  # Keep Actions versions current. PlatformIO library deps are pinned in
  # platformio.ini and not natively supported by Dependabot, so they are
  # reviewed manually before each release.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"
