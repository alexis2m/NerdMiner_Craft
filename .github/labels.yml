# Source of truth for issue / PR labels. Apply with a label sync tool
# (e.g. `gh label create` from CI, or run manually after fork creation).

- name: bug
  color: d73a4a
  description: Something is broken.

- name: enhancement
  color: a2eeef
  description: A new feature or improvement.

- name: theme
  color: 7057ff
  description: Minecraft theme, sprite, animation, or screen layout work.

- name: art
  color: bfd4f2
  description: Pixel art assets — PNGs, sprite sheets, palette.

- name: hardware
  color: f9d0c4
  description: Pertains to a specific Freenove FNK0103 variant or other board.

- name: docs
  color: 0075ca
  description: Documentation only.

- name: ci
  color: 27c281
  description: CI / GitHub Actions / build tooling.

- name: dependencies
  color: 0366d6
  description: Dependency bumps.

- name: triage
  color: e4e669
  description: Awaiting maintainer triage.

- name: good first issue
  color: 7057ff
  description: A friendly entry point for new contributors.

- name: help wanted
  color: 008672
  description: Extra eyes or hands welcome.

- name: wontfix
  color: ffffff
  description: Out of scope for this fork — try upstream NerdMiner_v2.
