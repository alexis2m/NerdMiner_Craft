# Wokwi simulator configuration.
# https://docs.wokwi.com/vscode/getting-started
#
# How to run:
#   1. `pio run -e <env>` to produce the .bin and .elf below.
#   2. Open this file in VS Code with the "Wokwi for VS Code" extension installed.
#   3. Hit F1 → "Wokwi: Start Simulator", or click the "Start Simulator" lens above.
#   4. The diagram (diagram.json) opens alongside the running ESP32.
#
# Default points at the upstream ESP32-2432S028R env, which is the closest
# already-buildable target to the FNK0103B hardware (same CYD family, ILI9341
# variant). It will boot and render the existing upstream UI in the simulator
# so we can verify the stack end-to-end before any board-specific code lands.
#
# When the [env:FNK0103B-ST7789-28] env exists, swap the two paths below to
# .pio/build/FNK0103B-ST7789-28/firmware.bin and .elf, and change the lcd
# part in diagram.json from wokwi-ili9341 to a wokwi-st7789 variant.

[wokwi]
version = 1
# Wokwi loads a single .bin starting at flash offset 0x0, expecting the
# bootloader to be at the start. PlatformIO's per-target firmware.bin is
# only the application (it goes to 0x10000 on real hardware), so loading
# it standalone causes the simulator to interpret app bytes as bootloader,
# which crashes immediately at the entry point and boot-loops with
# rst:0x3 (SW_RESET).
#
# firmware_merged.bin is a single image with bootloader (0x1000) +
# partitions (0x8000) + app (0x10000), produced by:
#
#   esptool.py --chip esp32 merge_bin \
#     -o .pio/build/ESP32-2432S028R/firmware_merged.bin \
#     --flash_mode dio --flash_freq 80m --flash_size 4MB \
#     0x1000  .pio/build/ESP32-2432S028R/bootloader.bin \
#     0x8000  .pio/build/ESP32-2432S028R/partitions.bin \
#     0x10000 .pio/build/ESP32-2432S028R/firmware.bin
#
# A PlatformIO post-build hook to regenerate this on every `pio run` will
# follow once we've confirmed Wokwi boots from it.
firmware = '.pio/build/ESP32-2432S028R/firmware_merged.bin'
elf      = '.pio/build/ESP32-2432S028R/firmware.elf'
# Required only when starting in Debug Mode (F5). Plain Start Simulator
# (F1 -> "Wokwi: Start Simulator") works without it.
gdbServerPort = 3333
